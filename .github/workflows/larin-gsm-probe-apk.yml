name: LARIN GSM — диагностический APK (проба)
# Подпись: секреты LARIN_KEYSTORE_BASE64, LARIN_KEYSTORE_PASSWORD, LARIN_KEY_ALIAS; переменная LARIN_CERT_SHA256.

# Отдельная сборка отдельного приложения ru.larincold.gsmprobe.
# Основное приложение LARIN GSM и каталог app/ не затрагиваются.
on:
  push:
    branches: [larin-gsm-control-build, larin-gsm-signing-probe]
    paths:
      - 'gsm_probe/**'
      - '.github/workflows/larin-gsm-probe-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ключ подписи (тот же, что у LARIN GSM)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LARIN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета LARIN_KEYSTORE_BASE64. Без постоянного ключа нельзя проверить обновление поверх (тест 15)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/larin"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/larin/release.p12"
          echo "LARIN_KEYSTORE_PATH=$RUNNER_TEMP/larin/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          LARIN_KEYSTORE_PASSWORD: ${{ secrets.LARIN_KEYSTORE_PASSWORD }}
          LARIN_KEY_ALIAS: ${{ secrets.LARIN_KEY_ALIAS }}
          LARIN_KEY_PASSWORD: ${{ secrets.LARIN_KEYSTORE_PASSWORD }}
          PROBE_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set +e
          gradle -p gsm_probe :app:assembleRelease --no-daemon --console=plain 2>&1 | tee probe-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Причина ошибки — в аннотации, чтобы её было видно без полного журнала.
            python3 - <<'PY'
          import re
          log = open("probe-build.log", encoding="utf-8", errors="replace").read()
          parts = re.findall(r"\* What went wrong:\n(.*?)(?:\n\* Try:|\Z)", log, re.S)
          errs = [l for l in log.splitlines() if l.startswith(("e: ", "ERROR", "FAILURE"))]
          text = ("\n".join(errs[-30:]) + "\n" + "\n".join(parts)).strip()[:3800] or log[-3500:]
          print("::error title=Gradle::" + text.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
            exit "$rc"
          fi

      - name: Проверка APK
        shell: bash
        run: |
          set -euo pipefail
          APK=gsm_probe/app/build/outputs/apk/release/app-release.apk
          cp "$APK" "larin-gsm-probe-${{ github.run_number }}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|Sdk|uses-permission" | tee probe-badging.txt
          "$BT/apksigner" verify --print-certs "$APK" | tee probe-signature.txt
          {
            echo "## Проба LARIN GSM №${{ github.run_number }}"
            echo '```'
            cat probe-badging.txt
            grep "SHA-256" probe-signature.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LARIN-GSM-Probe-${{ github.run_number }}
          path: |
            larin-gsm-probe-${{ github.run_number }}.apk
            probe-badging.txt
            probe-signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove key from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/larin"
