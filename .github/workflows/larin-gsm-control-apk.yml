name: LARIN COLD GSM Control — APK из ZIP

on:
  push:
    branches: [larin-gsm-control-build]
    paths:
      - 'LARIN_COLD_GSM_Control_GitHub_Mini_0.1.1.zip'
      - '.github/workflows/larin-gsm-control-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack original LARIN COLD source
        shell: bash
        run: |
          mkdir -p larin_gsm_control
          unzip -q LARIN_COLD_GSM_Control_GitHub_Mini_0.1.1.zip -d larin_gsm_control
          test -f larin_gsm_control/pubspec.yaml
          test -f larin_gsm_control/lib/main.dart
          test -s larin_gsm_control/assets/larin_cold_logo.png

      - name: Generate Android project
        working-directory: larin_gsm_control
        run: flutter create --platforms=android --project-name=larin_cold_gsm_control --org=ru.larincold .

      - name: Configure SMS app visibility
        working-directory: larin_gsm_control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          query = '''
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="smsto" />
                  </intent>
          '''
          if '</queries>' in text:
              text = text.replace('</queries>', query + '</queries>', 1)
          else:
              text = text.replace('</manifest>', '<queries>' + query + '</queries>\n</manifest>', 1)
          manifest.write_text(text)
          root = ET.fromstring(text)
          ns = '{http://schemas.android.com/apk/res/android}'
          assert any(
              i.find('action') is not None and
              i.find('action').get(ns + 'name') == 'android.intent.action.SENDTO' and
              i.find('data') is not None and
              i.find('data').get(ns + 'scheme') == 'smsto'
              for i in root.findall('./queries/intent')
          ), 'Missing SMS package visibility query'
          pubspec = Path('pubspec.yaml')
          source = pubspec.read_text()
          assert 'version: 0.1.1+2' in source
          pubspec.write_text(source.replace('version: 0.1.1+2', 'version: 0.1.2+3', 1))
          PY

      - name: Install dependencies
        working-directory: larin_gsm_control
        run: flutter pub get

      - name: Run Dart tests
        working-directory: larin_gsm_control
        run: |
          rm -f test/widget_test.dart # template references MyApp, not our real app
          flutter test

      - name: Install branded icons
        working-directory: larin_gsm_control
        run: bash tool/install_android_icons.sh

      - name: Build release APK
        working-directory: larin_gsm_control
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LARIN-COLD-GSM-Control-v0.1.2-APK
          path: larin_gsm_control/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
