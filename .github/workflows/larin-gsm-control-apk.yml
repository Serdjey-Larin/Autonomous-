name: LARIN COLD GSM Control — APK из ZIP
# Подпись: секреты LARIN_KEYSTORE_BASE64, LARIN_KEYSTORE_PASSWORD, LARIN_KEY_ALIAS; переменная LARIN_CERT_SHA256.

on:
  push:
    branches: [larin-gsm-control-build, larin-gsm-signing-probe]
    paths:
      - 'LARIN_COLD_GSM_Control_GitHub_Mini_0.1.1.zip'
      - '.github/workflows/larin-gsm-control-apk.yml'
      - 'gsm_updates/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Закреплённая версия Flutter: шаблон Android, compileSdk/targetSdk, AGP и Kotlin
  # меняются только при осознанной правке этой строки.
  FLUTTER_VERSION: '3.47.8'
  # Ожидаемые разрешения в APK 1.4.9. Лишнее разрешение — предупреждение,
  # «чувствительное» (SMS, звонки, контакты, местоположение) — ошибка сборки.
  EXPECTED_PERMISSIONS: >-
    android.permission.POST_NOTIFICATIONS
    android.permission.SCHEDULE_EXACT_ALARM
    android.permission.RECEIVE_BOOT_COMPLETED
    android.permission.VIBRATE
    ru.larincold.larin_cold_gsm_control.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
  FORBIDDEN_PERMISSION_PATTERN: 'SMS|MMS|WAP_PUSH|CALL_LOG|READ_PHONE|READ_CONTACTS|LOCATION|BIND_NOTIFICATION_LISTENER|BIND_ACCESSIBILITY'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Release key — обязателен
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LARIN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LARIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LARIN_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Не заданы секреты LARIN_KEYSTORE_BASE64 / LARIN_KEYSTORE_PASSWORD / LARIN_KEY_ALIAS. Сборка со случайным ключом запрещена."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/larin"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/larin/release.p12"
          echo "LARIN_KEYSTORE_PATH=$RUNNER_TEMP/larin/release.p12" >> "$GITHUB_ENV"

      - name: Unpack original LARIN COLD source
        shell: bash
        run: |
          mkdir -p larin_gsm_control
          unzip -q LARIN_COLD_GSM_Control_GitHub_Mini_0.1.1.zip -d larin_gsm_control
          test -f larin_gsm_control/pubspec.yaml
          test -f larin_gsm_control/lib/main.dart
          test -s larin_gsm_control/assets/larin_cold_logo.png

      - name: Generate Android project
        working-directory: larin_gsm_control
        run: flutter create --platforms=android --project-name=larin_cold_gsm_control --org=ru.larincold .

      - name: Install app updates and configure Android
        run: |
          cp -R gsm_updates/. larin_gsm_control/
          cd larin_gsm_control
          python3 tool/configure_android.py

      - name: Install dependencies
        working-directory: larin_gsm_control
        run: flutter pub get

      - name: Run Dart tests
        working-directory: larin_gsm_control
        run: |
          rm -f test/widget_test.dart # template references MyApp, not our real app
          flutter test

      - name: Build release APK
        working-directory: larin_gsm_control
        env:
          LARIN_KEYSTORE_PASSWORD: ${{ secrets.LARIN_KEYSTORE_PASSWORD }}
          LARIN_KEY_ALIAS: ${{ secrets.LARIN_KEY_ALIAS }}
          LARIN_KEY_PASSWORD: ${{ secrets.LARIN_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Проверка APK — подпись, разрешения, SDK
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.LARIN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=larin_gsm_control/build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" > apk-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt
          CERT=$(grep -m1 'certificate SHA-256 digest' apk-signature.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          PERMS=$(grep "^uses-permission:" apk-badging.txt | sed -E "s/.*name='([^']+)'.*/\1/" | sort -u)
          {
            echo "## LARIN GSM — проверка APK"
            echo
            echo '```'
            grep -E "^package:|^sdkVersion|^targetSdkVersion" apk-badging.txt
            echo
            echo "certificate SHA-256: $CERT"
            echo
            echo "Разрешения:"
            echo "$PERMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^package:|Sdk|uses-permission" apk-badging.txt || true
          cat apk-signature.txt
          if grep -q "Android Debug" apk-signature.txt; then
            echo "::error::APK подписан debug-ключом"; exit 1
          fi
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            EXP=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$CERT" != "$EXP" ]; then
              echo "::error::Сертификат APK ($CERT) не совпадает с LARIN_CERT_SHA256 ($EXP)"; exit 1
            fi
          else
            echo "::warning::Переменная LARIN_CERT_SHA256 не задана — сертификат не сверяется."
          fi
          EXTRA=""
          for p in $PERMS; do
            case " $EXPECTED_PERMISSIONS " in *" $p "*) ;; *) EXTRA="$EXTRA $p";; esac
          done
          if [ -n "$EXTRA" ]; then
            echo "::warning::Разрешения сверх ожидаемых:$EXTRA"
          fi
          if echo "$PERMS" | grep -Eq "$FORBIDDEN_PERMISSION_PATTERN"; then
            echo "::error::В APK 1.4.9 попало чувствительное разрешение:"
            echo "$PERMS" | grep -E "$FORBIDDEN_PERMISSION_PATTERN"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LARIN-COLD-GSM-Control-v1.4.9-APK
          path: |
            larin_gsm_control/build/app/outputs/flutter-apk/app-release.apk
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove key from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/larin"
