name: larin_cold_gsm_control
description: Larin Cold Start — телефонный пульт по SMS и звонку.
publish_to: none
version: 1.8.0+180

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/larin_cold_logo.png
  # Exo 2 (SIL Open Font License, assets/fonts/OFL.txt) — шрифт логотипа,
  # встроен в приложение, интернет не нужен. Латиница + кириллица + ₽.
  fonts:
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Exo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Exo2-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Exo2-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Exo2-BlackItalic.ttf
          weight: 900
          style: italic
